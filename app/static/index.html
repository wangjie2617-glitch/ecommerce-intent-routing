<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>电商诉求智能路由</title>
  <style>
    :root { --ink:#18202b; --muted:#657184; --line:#dce3ec; --brand:#1367d1; --bg:#f4f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
    .shell { max-width:1000px; margin:0 auto; padding:48px 22px 70px; }
    .eyebrow { color:var(--brand); font-size:13px; font-weight:700; letter-spacing:.12em; }
    h1 { margin:10px 0 8px; font-size:clamp(30px,5vw,48px); letter-spacing:-.04em; }
    .lead { color:var(--muted); max-width:720px; line-height:1.7; }
    .grid { display:grid; grid-template-columns:1.1fr .9fr; gap:20px; margin-top:30px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 14px 40px rgba(28,48,78,.07); }
    label { display:block; margin-bottom:10px; font-weight:700; }
    textarea { width:100%; min-height:150px; resize:vertical; padding:16px; border:1px solid var(--line); border-radius:12px; font:inherit; line-height:1.6; outline:none; }
    textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(19,103,209,.12); }
    .examples { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 11px; cursor:pointer; color:#405067; }
    .chip:hover { border-color:var(--brand); color:var(--brand); }
    button.primary { width:100%; border:0; background:var(--brand); color:#fff; padding:13px 18px; border-radius:11px; font-weight:700; cursor:pointer; }
    button.primary:disabled { opacity:.55; cursor:wait; }
    .placeholder { color:var(--muted); line-height:1.8; }
    .intent { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--line); }
    .score { font-variant-numeric:tabular-nums; color:var(--brand); font-weight:700; }
    .route { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; }
    .metric { background:#f7f9fc; border-radius:10px; padding:12px; }
    .metric small { display:block; color:var(--muted); margin-bottom:4px; }
    .metric strong { font-size:18px; }
    .reasons { margin:0; padding-left:20px; color:#46546a; line-height:1.7; }
    .warning { color:#a44b00; background:#fff5e9; padding:10px 12px; border-radius:9px; }
    .error { color:#a4161a; background:#fff0f1; padding:12px; border-radius:10px; }
    footer { color:var(--muted); font-size:13px; margin-top:24px; }
    @media(max-width:760px){ .grid{grid-template-columns:1fr;} .shell{padding-top:28px;} }
  </style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">NLP · MULTI-LABEL ROUTING</div>
  <h1>电商客户诉求智能路由</h1>
  <p class="lead">识别一条消息中的多个诉求，结合置信度和风险规则，给出处理部门、优先级、SLA与人工复核建议。</p>
  <section class="grid">
    <div class="card">
      <label for="message">客户消息</label>
      <textarea id="message" maxlength="500">快递已经一周没有更新了，我不想等了，帮我退款</textarea>
      <div class="examples">
        <button class="chip" data-text="这个耳机支持蓝牙5.3吗？">商品咨询</button>
        <button class="chip" data-text="快递一直没更新，我不想等了，帮我退款">多重诉求</button>
        <button class="chip" data-text="刚收到就发现屏幕碎了，我要投诉消协">高风险投诉</button>
        <button class="chip" data-text="付款成功为什么订单还是待支付？">支付问题</button>
      </div>
      <button id="submit" class="primary">分析并路由</button>
    </div>
    <div id="result" class="card">
      <p class="placeholder">分析结果会显示在这里。模型尚未训练时，接口会提示先运行训练脚本。</p>
    </div>
  </section>
  <footer>个人实践项目 · 数据为公开语义模式与可复现模板合成，不代表真实企业生产效果。</footer>
</main>
<script>
  const textArea = document.querySelector('#message');
  const button = document.querySelector('#submit');
  const result = document.querySelector('#result');
  document.querySelectorAll('.chip').forEach(item => item.addEventListener('click', () => { textArea.value = item.dataset.text; }));
  const escapeHtml = value => value.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  button.addEventListener('click', async () => {
    const text = textArea.value.trim();
    if (!text) return;
    button.disabled = true; button.textContent = '分析中…';
    result.innerHTML = '<p class="placeholder">正在执行多标签识别和路由规则…</p>';
    try {
      const response = await fetch('/api/v1/predict', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || '请求失败');
      const intents = data.intents.map(x => `<div class="intent"><span>${escapeHtml(x.label)}</span><span class="score">${(x.score*100).toFixed(1)}%</span></div>`).join('');
      const reasons = data.route.reasons.map(x => `<li>${escapeHtml(x)}</li>`).join('');
      result.innerHTML = `<h2>识别结果</h2>${intents}<div class="route">
        <div class="metric"><small>处理部门</small><strong>${escapeHtml(data.route.department)}</strong></div>
        <div class="metric"><small>优先级</small><strong>${escapeHtml(data.route.priority)}</strong></div>
        <div class="metric"><small>响应时限</small><strong>${data.route.sla_minutes} 分钟</strong></div>
        <div class="metric"><small>推理耗时</small><strong>${data.latency_ms} ms</strong></div>
      </div>${data.route.manual_review ? '<p class="warning">需要人工复核</p>' : ''}<h3>路由依据</h3><ul class="reasons">${reasons}</ul>`;
    } catch (error) { result.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`; }
    finally { button.disabled = false; button.textContent = '分析并路由'; }
  });
</script>
</body>
</html>
